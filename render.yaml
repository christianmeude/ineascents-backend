# 12-Factor: one service per env, config in environment. No code fallback to another env's URL/DB.
# Only PROD lives in the cloud; dev is the local machine (Supabase CLI + php artisan serve). See docs/adr/0009.
# Real values (secrets, DB, PayMongo) live in Render dashboard Env Groups — never committed.
# Runtime: Docker (./Dockerfile, php:8.4-apache).
services:
  - type: web
    name: ineascents
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://ineascents.onrender.com
      - key: FRONTEND_URL
        # 12-Factor: isolated per env — Production Vercel URL for client
        # Mirror of Render dashboard (dashboard wins over blueprint).
        value: https://ineascents-app.vercel.app
      - key: LANDING_URL
        # Fill with the deployed landing URL when it ships (Inquiry POSTs).
        # Local + production only, no staging. No trailing slash — origins
        # are exact-matched in config/cors.php.
        # Mirror of Render dashboard (dashboard wins over blueprint).
        value: "https://ineascents.vercel.app"
      - key: CORS_SUPPORTS_CREDENTIALS
        value: false
      - key: SANCTUM_STATEFUL_DOMAINS
        # Mirror of Render dashboard (dashboard wins over blueprint).
        value: ineascents-app.vercel.app,ineascents-app-christianmeude1.vercel.app
      - key: SESSION_DOMAIN
        value: "" # host-only
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        # stderr streams to Render logs. Never `stack`/`single` here: file
        # logs are invisible inside the container (ephemeral storage).
        value: stderr
      - key: CRON_TOKEN
        generateValue: true
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false # Supabase project `ineascents-db` (christianmeude org)
      - key: MAIL_MAILER
        # Mirror of Render dashboard (dashboard wins over blueprint).
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false # ineascents.app@gmail.com (dashboard)
      - key: MAIL_PASSWORD
        sync: false # Gmail App Password, spaces removed (dashboard)
      - key: MAIL_FROM_ADDRESS
        # Mirror of Render dashboard (dashboard wins over blueprint).
        value: ineascents.app@gmail.com
      - key: MAIL_FROM_NAME
        value: Inea Scents
        # Real values (PayMongo sk/pk live) set via Env Group in dashboard.
databases: []